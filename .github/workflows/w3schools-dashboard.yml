name: Update W3Schools Dashboard

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate dashboard
        run: |
          python3 - <<'PY'
          import json
          import base64
          import urllib.request
          from datetime import datetime, timezone
          from xml.sax.saxutils import escape

          API_URL = (
              "https://pathfinder-api.kai.w3spaces.com/"
              "public-profile-api/AmpVolume"
          )

          LOGO_URL = (
              "https://commons.wikimedia.org/wiki/Special:FilePath/"
              "W3Schools%20logo.png"
          )

          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "AmpVolume-GitHub-Dashboard"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read()

          data = json.loads(fetch(API_URL).decode("utf-8"))
          activity = data.get("activity", {})
          competition = data.get("competitionPerformance", {})

          metrics = [
              ("LESSONS READ", activity.get("lessonsRead", 0), "BOOK"),
              ("TOTAL POINTS", activity.get("totalPoints", 0), "STAR"),
              ("CURRENT STREAK", competition.get("currentStreak", 0), "FIRE"),
              ("EXERCISE POINTS", activity.get("exercisePoints", 0), "CODE"),
              ("QUIZ POINTS", activity.get("quizPoints", 0), "QUIZ"),
              ("CHALLENGES COMPLETED",
               activity.get("completedChallenges", 0), "TARGET"),
          ]

          # Download and embed the logo, with a fallback if unavailable.
          try:
              logo_bytes = fetch(LOGO_URL)
              logo_b64 = base64.b64encode(logo_bytes).decode("ascii")
              logo = (
                  '<image x="30" y="25" width="155" height="34" '
                  'preserveAspectRatio="xMinYMid meet" '
                  f'href="data:image/png;base64,{logo_b64}"/>'
              )
          except Exception as error:
              print(f"Logo download failed; using fallback: {error}")
              logo = """
              <rect x="30" y="22" width="58" height="42"
                    rx="8" fill="#04AA6D"/>
              <text x="59" y="50" text-anchor="middle"
                    font-size="23" font-weight="800"
                    fill="#ffffff">W3</text>
              """

          # Real vector icons. Each icon is SVG markup, not a text label.
          icons = {
              "BOOK": """
                <path d="M2 3.5A2.5 2.5 0 0 1 4.5 1H16v16H4.5
                         A2.5 2.5 0 0 1 2 14.5z"/>
                <path d="M2 14.5A2.5 2.5 0 0 1 4.5 12H16"/>
              """,
              "STAR": """
                <path d="m9 1.5 2.3 4.7 5.2.8-3.8 3.7.9 5.2
                         L9 13.4l-4.6 2.5.9-5.2L1.5 7l5.2-.8z"/>
              """,
              "FIRE": """
                <path d="M9 17a5 5 0 0 0 5-5c0-3-2-4-2-7
                         -2 2-3 3-3 5-1-1-2-2-2-3
                         -2 2-3 4-3 6a5 5 0 0 0 5 4z"/>
              """,
              "CODE": """
                <path d="m6 3-5 6 5 6"/>
                <path d="m12 3 5 6-5 6"/>
                <path d="m10 1-2 16"/>
              """,
              "QUIZ": """
                <circle cx="9" cy="9" r="7.5"/>
                <path d="M6.5 6.5a2.5 2.5 0 1 1 4 2
                         c-1.2.8-1.5 1.3-1.5 2.5"/>
                <circle cx="9" cy="14.5" r=".5" fill="#04AA6D"
                        stroke="none"/>
              """,
              "TARGET": """
                <circle cx="9" cy="9" r="7.5"/>
                <circle cx="9" cy="9" r="4"/>
                <circle cx="9" cy="9" r="1"/>
              """,
          }

          cards = []

          for i, (label, value, icon) in enumerate(metrics):
              col = i % 3
              row = i // 3
              x = 30 + col * 315
              y = 112 + row * 105

              cards.append(f"""
              <g>
                <rect x="{x}" y="{y}" width="295" height="88"
                      rx="13" fill="#202B36"
                      stroke="#344451" stroke-width="1"/>

                <rect x="{x}" y="{y+13}" width="4" height="60"
                      rx="2" fill="#04AA6D"/>

                <text x="{x+18}" y="{y+27}"
                      font-family="Arial, Helvetica, sans-serif"
                      font-size="11" font-weight="600"
                      letter-spacing="1.1" fill="#A9B8C5">
                  {escape(label)}
                </text>

                <text x="{x+18}" y="{y+64}"
                      font-family="Arial, Helvetica, sans-serif"
                      font-size="29" font-weight="700"
                      fill="#FFFFFF">
                  {escape(str(value))}
                </text>

                <circle cx="{x+260}" cy="{y+45}" r="17"
                        fill="#123C31"/>

                <g transform="translate({x+251},{y+36})"
                   fill="none" stroke="#04AA6D"
                   stroke-width="1.7" stroke-linecap="round"
                   stroke-linejoin="round">
                  {icons[icon]}
                </g>
              </g>
              """)

          updated = datetime.now(timezone.utc).strftime(
              "%b %d, %Y at %H:%M UTC"
          )

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg"
              width="1000" height="360" viewBox="0 0 1000 360">
            <rect width="1000" height="360" rx="18" fill="#111820"/>
            <rect x="1" y="1" width="998" height="358" rx="17"
                  fill="none" stroke="#263642"/>

            {logo}

            <text x="205" y="38"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="11" font-weight="700"
                  letter-spacing="2" fill="#04AA6D">
              LEARNING ANALYTICS
            </text>

            <text x="205" y="60"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="19" font-weight="700" fill="#FFFFFF">
              AmpVolume
            </text>

            <rect x="825" y="30" width="145" height="29"
                  rx="14" fill="#123C31"/>
            <circle cx="842" cy="44" r="4" fill="#04AA6D"/>
            <text x="854" y="48"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="10" font-weight="700"
                  fill="#04AA6D">PROFILE STATS</text>

            <line x1="30" y1="82" x2="970" y2="82"
                  stroke="#344451"/>

            {''.join(cards)}

            <line x1="30" y1="329" x2="970" y2="329"
                  stroke="#344451"/>

            <text x="30" y="347"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="10" fill="#A9B8C5">
              W3Schools public profile · Auto-updated every 6 hours
            </text>

            <text x="970" y="347" text-anchor="end"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="10" fill="#04AA6D">
              {escape(updated)}
            </text>
          </svg>"""

          with open(
              "w3schools-dashboard.svg", "w", encoding="utf-8"
          ) as file:
              file.write(svg)

          print("Dashboard SVG generated successfully.")
          PY

      - name: Save updated dashboard
        run: |
          git add w3schools-dashboard.svg

          if git diff --cached --quiet; then
            echo "Dashboard is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update W3Schools learning dashboard"

          git pull --rebase origin main
          git push origin main
