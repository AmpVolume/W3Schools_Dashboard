name: Update W3Schools Dashboard

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate dashboard
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          from xml.sax.saxutils import escape

          url = "https://pathfinder-api.kai.w3spaces.com/public-profile-api/AmpVolume"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "AmpVolume-GitHub-Dashboard"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)

          activity = data.get("activity", {})
          competition = data.get("competitionPerformance", {})

          metrics = [
              ("LESSONS READ", activity.get("lessonsRead", 0)),
              ("TOTAL POINTS", activity.get("totalPoints", 0)),
              ("EXERCISE POINTS", activity.get("exercisePoints", 0)),
              ("QUIZ POINTS", activity.get("quizPoints", 0)),
              ("CURRENT STREAK", competition.get("currentStreak", 0)),
              ("CHALLENGES", activity.get("completedChallenges", 0)),
          ]

          cards = []
          for i, (label, value) in enumerate(metrics):
              x = 30 + (i % 3) * 280
              y = 105 + (i // 3) * 95
              cards.append(f"""
              <rect x="{x}" y="{y}" width="260" height="78"
                    rx="12" fill="#202b36" stroke="#344451"/>
              <text x="{x+18}" y="{y+27}" font-size="12"
                    fill="#a9b8c5" letter-spacing="1">{escape(label)}</text>
              <text x="{x+18}" y="{y+60}" font-size="27"
                    font-weight="700" fill="#04AA6D">{escape(str(value))}</text>
              """)

          updated = datetime.now(timezone.utc).strftime(
              "%Y-%m-%d %H:%M UTC"
          )

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg"
              width="900" height="330" viewBox="0 0 900 330">
            <rect width="900" height="330" rx="18" fill="#111820"/>
            <rect width="8" height="330" rx="4" fill="#04AA6D"/>
            <text x="30" y="38" font-size="13" fill="#04AA6D"
                  font-weight="700" letter-spacing="2">LEARNING DASHBOARD</text>
            <text x="30" y="73" font-size="27" fill="#ffffff"
                  font-weight="700">W3Schools · AmpVolume</text>
            {''.join(cards)}
            <text x="30" y="306" font-size="12" fill="#a9b8c5">
              Source: W3Schools public profile · Refreshed {updated}
            </text>
          </svg>"""

          with open("w3schools-dashboard.svg", "w", encoding="utf-8") as f:
              f.write(svg)

          print("Dashboard generated successfully.")
          PY

      - name: Save updated dashboard
        run: |
          git add w3schools-dashboard.svg
          if git diff --cached --quiet; then
            echo "Dashboard is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update W3Schools learning dashboard"
          git push

